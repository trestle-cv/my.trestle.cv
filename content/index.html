<main class="auth-gate" data-launcher data-product="trestle" data-default-host="localhost" data-default-port="7333">
  <form class="auth-card" data-config novalidate>
    <div class="brand"><span>T</span> Trestle</div>
    <div class="error" data-error role="alert" hidden></div>
    <label>Domain or IP<input name="host" value="localhost" placeholder="localhost or https://trestle.example.com" autocomplete="url" spellcheck="false"></label>
    <label>Port<input name="port" type="number" min="1" max="65535" value="7333" inputmode="numeric"></label>
    <div class="actions"><button type="submit">Save</button><button type="button" class="secondary" data-defaults>Use defaults</button></div>
    <button type="button" class="secondary open" data-open>Open</button>
  </form>
</main>
